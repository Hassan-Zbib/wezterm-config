# ============================================================
# Yazi Keymap
# ============================================================
# Managed by dotbot — run ./install from the repo to symlink.
# Only overrides are listed here; all other defaults are kept.
#
# NOTE: the section is [mgr], not [manager]. Yazi renamed it and
# silently ignores the old name — no error, the bindings just
# never apply.
# ============================================================

[mgr]
prepend_keymap = [
   # Replace Ctrl+U/D half-page scroll with Ctrl+PgUp/PgDn.
   # Bare PageUp/PageDown keep yazi's default full-page scroll: WezTerm leaves
   # them unbound on purpose and puts its own scrolling on Shift/Alt (see the
   # "panes: scroll pane" block in config/bindings.lua), so yazi always sees
   # them.
   { on = ["<C-u>"],        run = "noop" },
   { on = ["<C-d>"],        run = "noop" },
   { on = ["<C-PageUp>"],   run = "arrow -50%", desc = "Scroll up half page" },
   { on = ["<C-PageDown>"], run = "arrow 50%",  desc = "Scroll down half page" },
]
