# ============================================================
# Yazi Config
# ============================================================
# Managed by dotbot — run ./install from the repo to symlink.
#
# NOTE: the section is [mgr], not [manager]. Yazi renamed it and
# silently ignores the old name — no error, the settings just
# never apply.
# ============================================================

[mgr]
show_hidden    = true
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
show_symlink   = true

[preview]
image_filter   = "triangle"
image_quality  = 75
max_width      = 600
max_height     = 900

[opener]
# %s expands to the paths of all selected files. The older
# "$@" form is no longer supported.
edit = [
   { run = 'vim %s', block = true, desc = "vim" },
]

# Required by the git plugin (yazi-rs/plugins:git). Calling
# require("git"):setup() in init.lua is not enough on its own —
# without these fetchers the status signs never appear, and yazi
# gives no error. Two entries: files ("*") and directories ("*/").
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
