# ============================================================
# Yazi Theme — Catppuccin Macchiato (via official flavor)
# ============================================================
# Managed by dotbot — run ./install from the repo to symlink.
#
# The colours come from the official flavor package:
#   ya pkg add yazi-rs/flavors:catppuccin-macchiato
# It installs to ~/AppData/Roaming/yazi/config/flavors/ and is
# installed automatically by ./install.
#
# Yazi merges this file OVER the flavor, so anything set below
# wins. Keep it small — the flavor tracks upstream schema
# renames for us.
# ============================================================

[flavor]
dark  = "catppuccin-macchiato"
light = "catppuccin-macchiato"

# ─── Personal overrides ─────────────────────────────────────
# Dimmer pane borders than the flavor default (#8087a2 overlay0).
# Delete this block to use the stock flavor borders.
[mgr]
border_style = { fg = "#494d64" }
