onboarding = false
# herdr configuration
#
# Deliberately minimal: anything not set here is herdr's own default. Print the
# full annotated surface with `herdr --default-config`, validate with
# `herdr config check`, apply to a running server with `herdr server
# reload-config` (or prefix+shift+r).
#
# Never let an editor add a UTF-8 BOM: herdr #3678 makes a BOM silently fall
# back to defaults.

[terminal]
# MSYS zsh in the Git for Windows tree (scripts/install-zsh.sh), matching
# WezTerm's default_prog. It sits in /usr/bin beside msys-2.0.dll, so the loader
# resolves it from any parent process with no PATH setup -- unlike the old
# portable install under ~/.local/zsh, where every pane died instantly with
# 0xC0000135 STATUS_DLL_NOT_FOUND and respawned in a loop.
default_shell = "C:/Program Files/Git/usr/bin/zsh.exe"

# shell_mode is deliberately NOT set: "login" makes herdr 0.9.0 on Windows
# silently spawn cmd.exe instead of the configured shell, with nothing in the
# log. Unset means panes run a NON-login zsh, so .zshrc is sourced in full but
# /etc/profile is not -- hence the MSYS PATH guard in home/.zshenv, without
# which the pane has no coreutils and compinit dies on its first `mv`.

[keys]
# Backtick: one key, above Tab, no chord. Spelling matters -- "backtick"
# validates, "grave" is rejected.
#
# THE TRADE-OFF: herdr has no send-prefix-literally escape, so a literal
# backtick cannot be typed in any pane. Accepted deliberately. Markdown fences
# in Claude Code prompts are where it would bite; ctrl+g is the fallback, also
# left-handed, displacing only zsh's send-break (which ctrl+c covers).
#
# Rejected: ctrl+space never registers at all (terminals encode it as NUL), and
# ctrl+b, the stock default, collides with both Claude Code's background-task
# key and backward-char in emacs-mode zsh.
#
# Press prefix+? for the live list; it is authoritative over these comments.
prefix = "backtick"

# The bindings below mirror config/bindings.lua so the same finger motion works
# at both layers. One rule generates all of them: DROP `alt`, ADD THE PREFIX,
# KEEP `ctrl` WHERE WEZTERM HAD `alt+ctrl`. WezTerm's two tiers survive as
# prefix vs prefix+ctrl.
#
# Nothing here can collide with WezTerm, which sees every keystroke first --
# which is also why the F-key half of the scheme is not mirrored: those keys
# physically cannot reach herdr, so those actions keep their stock bindings.

# -- panes --
# herdr names splits by their divider, so "horizontal" is the stacked one.
split_horizontal = "prefix+\\"
split_vertical   = "prefix+ctrl+\\"
# Arrows rather than stock h/j/k/l, matching wezterm's alt+ctrl+arrows. hjkl
# still moves between panes inside navigate mode (prefix+g).
focus_pane_left  = "prefix+left"
focus_pane_down  = "prefix+down"
focus_pane_up    = "prefix+up"
focus_pane_right = "prefix+right"
zoom             = "prefix+enter"
close_pane       = "prefix+w"
#
# resize_pane_* deliberately unset: resizing stays on stock resize mode
# (prefix+r). A flat ctrl+shift+alt+arrows would mirror wezterm and is free, but
# a four-key chord held repeatedly beats entering a mode once and tapping.

# -- tabs --
new_tab      = "prefix+t"
close_tab    = "prefix+ctrl+w"
previous_tab = "prefix+["
next_tab     = "prefix+]"
# Stock already, stated because bindings.lua now carries a matching alt+1..9.
switch_tab   = "prefix+1..9"
# wezterm groups tab naming on 0, so 0 means "names" at both layers. Displaces
# stock prefix+shift+t.
rename_tab   = "prefix+0"
#
# move_tab_previous/next stay unset: their wezterm equivalent is
# ctrl+shift+left/right, which wezterm swallows before herdr can see it.

# -- workspaces --
# Free wins: both unbound by default, and the alt+ctrl+[ / ] habit transfers.
previous_workspace = "prefix+ctrl+["
next_workspace     = "prefix+ctrl+]"
# Displaced from stock prefix+w by close_pane. The other workspace verbs keep
# their stock bindings, since their wezterm counterparts live in the F5 hub and
# F5 cannot reach herdr.
workspace_picker   = "prefix+shift+w"
# In turn displaced by the picker; parks on ctrl+0 to stay in the "0 means
# names" group.
rename_workspace   = "prefix+ctrl+0"

# -- agents --
# herdr-only, so there is no wezterm muscle memory to match. This is the form
# herdr's own default config documents.
focus_agent = "prefix+alt+1..9"

[theme.custom]
# Leaves pane backgrounds unpainted so the WezTerm backdrop shows through,
# matching the translucent status bars in colors/palette.lua. Set a hex color if
# chrome turns out unreadable over a busy wallpaper.
panel_bg = "reset"

[experimental]
# Off is herdr's default and its documented recommendation: enabling it writes
# recent pane output to session-history.json in plaintext, which "can include
# secrets, tokens, prompts, and command output". Layout still restores after a
# server restart; only visible scrollback does not.
pane_history = false

[theme]
name = "dracula"
auto_switch = false

[ui.sound]
enabled = true

[ui]
status_indicators = "symbols"

[ui.toast]
delivery = "herdr"
