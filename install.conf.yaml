- defaults:
    link:
      create: true
      relink: true
      force: true

- clean: ['~']

- link:
    ~/.wezterm.lua: home/.wezterm.lua
    ~/.bashrc: home/.bashrc
    ~/.bash_profile: home/.bash_profile
    ~/.zshrc: home/.zshrc
    ~/.zprofile: home/.zprofile
    ~/.zshenv: home/.zshenv
    ~/.zsh_plugins.txt: home/.zsh_plugins.txt
    ~/.inputrc: home/.inputrc
    ~/.gitconfig: home/.gitconfig
    ~/.vimrc: home/.vimrc
    ~/.config/starship.toml: home/.config/starship.toml
    ~/.config/git/ignore: home/.config/git/ignore
    ~/.config/fastfetch/config.jsonc: home/.config/fastfetch/config.jsonc
    ~/.config/eza/theme.yml: home/.config/eza/theme.yml
    ~/.config/ccstatusline/settings.json: home/.config/ccstatusline/settings.json
    ~/.config/atuin/config.toml: home/.config/atuin/config.toml
    # herdr writes to this file itself -- onboarding persists its answers here,
    # and `herdr config reset-keys` backs the file up before rewriting it. Through
    # the symlink those writes land in the repo, which is what we want, but if
    # reset-keys ever replaces the link with a plain file, re-run ./install.
    ~/AppData/Roaming/herdr/config.toml: home/AppData/Roaming/herdr/config.toml
    ~/AppData/Roaming/yazi/config/yazi.toml: home/AppData/Roaming/yazi/config/yazi.toml
    ~/AppData/Roaming/yazi/config/theme.toml: home/AppData/Roaming/yazi/config/theme.toml
    ~/AppData/Roaming/yazi/config/init.lua: home/AppData/Roaming/yazi/config/init.lua
    ~/AppData/Roaming/yazi/config/keymap.toml: home/AppData/Roaming/yazi/config/keymap.toml
    ~/AppData/Local/lazygit/config.yml: home/AppData/Local/lazygit/config.yml
    ~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1: home/Documents/PowerShell/Microsoft.PowerShell_profile.ps1
    ~/.config/wsl/wezterm-integration.bash: home/.config/wsl/wezterm-integration.bash
    ~/AppData/Local/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/settings.json: home/AppData/Local/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/settings.json
    ~/bin/lazyssh.exe: bin/lazyssh.exe
    ~/bin/ramload.exe: bin/ramload.exe
    ~/bin/git: bin/git

- create:
    - ~/.config/wezterm/sessions
    - ~/bin

- winget:
    # required
    - wez.wezterm.nightly
    - Microsoft.PowerShell
    - Git.Git
    - DEVCOM.JetBrainsMonoNerdFont
    - Starship.Starship
    - sxyazi.yazi
    - Fastfetch-cli.Fastfetch
    # optional CLI tools
    - JesseDuffield.lazygit
    - dandavison.delta
    - eza-community.eza
    - sharkdp.bat
    - rsteube.Carapace
    - charmbracelet.glow
    - Devolutions.UniGetUI
    - ajeetdsouza.zoxide
    - junegunn.fzf
    - Atuinsh.Atuin

- shell:
    # bin/ramload.exe is committed, so this only refreshes it when a Rust
    # toolchain happens to be around. Never fail the install over it: if the
    # rebuild is skipped the committed binary is still linked, and if the
    # binary is missing entirely right-status.lua falls back to PowerShell.
    - command: command -v rustc >/dev/null && rustc -O --edition 2021 scripts/ramload.rs -o bin/ramload.exe || true
      description: Building ramload helper (status bar RAM readout)
      quiet: true
    # Unpacks into C:\Program Files\Git, so this step needs an elevated shell.
    # Deliberately not `|| true`: on an already-provisioned machine the script
    # exits 0 immediately, so this only fails when zsh is genuinely missing --
    # a fresh machine, or a Git for Windows upgrade that wiped it -- and that
    # is worth stopping for rather than silently continuing without a shell.
    - command: bash scripts/install-zsh.sh
      description: Installing zsh into the Git for Windows tree (needs admin)
      quiet: true
    - command: bash scripts/install-zsh-plugins.sh
      description: Installing antidote + zsh plugins
      quiet: true
    - command: wsl -e bash -c "grep -q 'wezterm-integration.bash' ~/.bashrc 2>/dev/null || echo '[ -f /mnt/c/Users/hassa/.config/wsl/wezterm-integration.bash ] && source /mnt/c/Users/hassa/.config/wsl/wezterm-integration.bash' >> ~/.bashrc"
      description: Injecting WezTerm shell integration into WSL .bashrc
      quiet: true
    - command: ya pkg add yazi-rs/plugins:git || true
      description: Adding yazi git plugin
      quiet: true
    - command: ya pkg add Rolv-Apneseth/starship || true
      description: Adding yazi starship plugin
      quiet: true
    - command: ya pkg add yazi-rs/flavors:catppuccin-macchiato || true
      description: Adding yazi catppuccin-macchiato flavor
      quiet: true
    - command: ya pkg install
      description: Installing/updating all yazi plugins
      quiet: true
    - command: echo "Dotbot install complete!"
      description: Done
      quiet: true
